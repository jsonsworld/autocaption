<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBridge - Audio to Text & Translation</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fc 0%, #e9f0f7 100%);
        }
        .recording-pulse { 
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .language-select {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .language-select:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .record-button {
            transition: all 0.3s ease;
        }
        .record-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4 gradient-text">VoiceBridge</h1>
            <p class="text-xl text-gray-600">Transform your voice into text and translate it to any language</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-8 mb-8 card-hover">
            <div class="flex flex-col items-center space-y-6">
                <div class="w-full max-w-md text-center">
                    <p id="recording-status" class="text-lg font-medium text-gray-700">Ready to record...</p>
                </div>
                
                <div class="flex space-x-6">
                    <button id="start-record" 
                            class="record-button px-8 py-3 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-xl hover:from-blue-600 hover:to-indigo-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <span class="flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            </svg>
                            Start Recording
                        </span>
                    </button>
                    <button id="stop-record" 
                            class="record-button px-8 py-3 bg-gradient-to-r from-red-500 to-pink-500 text-white rounded-xl hover:from-red-600 hover:to-pink-600 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                        <span class="flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                            </svg>
                            Stop Recording
                        </span>
                    </button>
                </div>

                <div class="w-full max-w-md">
                    <label for="target-language" class="block text-sm font-medium text-gray-700 mb-2">Select Target Language:</label>
                    <select id="target-language" class="language-select w-full px-4 py-3 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="es">Spanish</option>
                        <option value="ko">Korean</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="audio-clips-container" class="space-y-6"></div>
    </div>

    <script>
        const startRecordButton = document.getElementById("start-record");
        const stopRecordButton = document.getElementById("stop-record");
        const recordingStatusText = document.getElementById("recording-status");
        const audioClipsContainer = document.getElementById("audio-clips-container");
        const targetLanguageSelect = document.getElementById("target-language");
        let mediaRecorder;
        let chunks = [];
        
        startRecordButton.addEventListener('click', async () => {
            try {
                recordingStatusText.innerHTML = '<span class="recording-pulse text-red-500">Recording in progress...</span>';
                startRecordButton.disabled = true;
                stopRecordButton.disabled = false;

                if (navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                } else {
                    showError("Audio recording is not supported on your device");
                }
            } catch (error) {
                console.error("Error:", error);
                showError("Failed to start recording. Please check your microphone permissions.");
            }
        });

        stopRecordButton.addEventListener('click', async () => {
            try {
                recordingStatusText.innerHTML = '<span class="text-blue-500">Processing audio...</span>';
                startRecordButton.disabled = false;
                stopRecordButton.disabled = true;
                
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                mediaRecorder.onstop = async () => {
                    const audioClip = document.createElement("div");
                    audioClip.className = "bg-white rounded-xl shadow-lg p-6 card-hover";
                    audioClip.innerHTML = `
                        <div class="space-y-6">
                            <div class="flex items-center space-x-4">
                                <audio controls class="flex-1 rounded-lg"></audio>
                                <div class="text-sm text-gray-500">Processing...</div>
                            </div>
                            <div class="border-t pt-6">
                                <div class="text-sm font-medium text-gray-700 mb-2">Original Text:</div>
                                <div class="text-gray-600 mb-6 p-4 bg-gray-50 rounded-lg" id="original-text">Processing...</div>
                                <div class="text-sm font-medium text-gray-700 mb-2">Translation:</div>
                                <div class="text-gray-600 p-4 bg-gray-50 rounded-lg" id="translated-text">Processing...</div>
                            </div>
                        </div>
                    `;
                    audioClipsContainer.prepend(audioClip);
                    
                    try {
                        const blob = new Blob(chunks, { type: "audio/mp3; codecs=opus" });
                        const data = new FormData();
                        data.append("audio", blob);
                        
                        const res = await axios.post("http://localhost:8888/upload", data);
                        const audioElement = audioClip.querySelector("audio");
                        audioElement.src = res.data.link;
                        
                        const originalTextDiv = audioClip.querySelector("#original-text");
                        const translatedTextDiv = audioClip.querySelector("#translated-text");
                        
                        originalTextDiv.textContent = res.data.text;
                        
                        const translationRes = await axios.post("http://localhost:8888/translate", {
                            text: res.data.text,
                            targetLang: targetLanguageSelect.value
                        });
                        
                        translatedTextDiv.textContent = translationRes.data.translatedText;
                        audioClip.querySelector(".text-gray-500").textContent = "Ready to play";
                    } catch (error) {
                        console.error("Error:", error);
                        showError("Failed to process audio. Please try again.");
                        audioClip.querySelector(".text-gray-500").textContent = "Failed to process";
                    }
                    
                    chunks = [];
                }

                setTimeout(() => recordingStatusText.textContent = "Ready to record...", 1000);
            } catch (error) {
                console.error("Error:", error);
                showError("Failed to stop recording");
            }
        });

        function showError(message) {
            const errorDiv = document.createElement("div");
            errorDiv.className = "bg-red-100 border border-red-400 text-red-700 px-6 py-4 rounded-xl relative mb-4";
            errorDiv.innerHTML = `
                <span class="block sm:inline">${message}</span>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-4">
                    <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <title>Close</title>
                        <path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/>
                    </svg>
                </span>
            `;
            audioClipsContainer.prepend(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }
    </script>
</body>
</html>
